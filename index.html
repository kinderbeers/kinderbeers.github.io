* { box-sizing: border-box; }

.acts { display: flex; gap: 8px; flex: none; }

@media (max-width: 379px) { .sugtext { display: none; } .pillbtn { padding: 0; } }
.tagline { margin: 10px 0 0; font-weight: 700; font-size: 22px; line-height: 1.15; text-wrap: balance; }
.rule { margin: 3px 0 0; color: var(--ink-soft); font-size: 15px; font-weight: 500; max-width: 38em; }

.wrap { padding-top: 38px; display: flex; flex-direction: column; gap: 14px; }
.notice {

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {

}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--foam); font-weight: 700; }
.status { margin: -4px 0 0; font-size: 13px; font-weight: 600; color: var(--on-bg); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }

.areas { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; }
.areas::-webkit-scrollbar { display: none; }
.area {
  flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }

.btn {

      dayList(m[1]).forEach(function (d) { days[d].push([s, e]); any = true; });
    });
    days.forEach(function (a) { a.sort(function (x, y) { return x[0] - y[0]; }); });
    return any ? days : null;
  }
  function berlinNow() {
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
    var o = {};
    parts.forEach(function (p) { o[p.type] = p.value; });
    return {
      day: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(o.weekday), min: parseInt(o.hour, 10) * 60 + parseInt(o.minute, 10),
      y: +o.year, m: +o.month, d: +o.day
    };
  }
  /* Sunset in Berlin as minutes after local midnight (NOAA-style approximation, good to a few minutes). */
  var SUN = -1;
  function sunsetMin(y, mo, d) {
    var rad = Math.PI / 180, lat = 52.52, lng = 13.405;
    var N = Math.round((Date.UTC(y, mo - 1, d) - Date.UTC(y, 0, 0)) / 86400000);
    var lh = lng / 15, tt = N + (18 - lh) / 24;
    var M = 0.9856 * tt - 3.289;
    var L = (M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634) % 360;
    var RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = (RA + 360) % 360;
    RA += Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90;
    RA /= 15;
    var sinD = 0.39782 * Math.sin(L * rad), cosD = Math.cos(Math.asin(sinD));
    var cosH = (Math.cos(90.833 * rad) - sinD * Math.sin(lat * rad)) / (cosD * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;
    var H = Math.acos(cosH) / rad / 15;
    var T = H + RA - 0.06571 * tt - 6.622;
    var ut = (((T - lh) % 24) + 24) % 24;
    var noon = new Date(Date.UTC(y, mo - 1, d, 12));
    var hr = parseInt(new Intl.DateTimeFormat('en-US', { timeZone: 'Europe/Berlin', hour: '2-digit', hourCycle: 'h23' }).format(noon), 10);
    return Math.round((ut + (hr - 12)) * 60);
  }
  function segEnd(seg, n) {
    if (seg[1] !== SUN) return seg[1];
    var e = sunsetMin(n.y, n.m, n.d);
    return e !== null && e > seg[0] ? e : null;
  }
  function openState(p) {
    if (!p.hrs) return { k: 'none' };
    var n = berlinNow(), today = p.hrs[n.day], yest = p.hrs[(n.day + 6) % 7], i, e;
    for (i = 0; i < today.length; i++) {
      e = segEnd(today[i], n);
      if (e !== null && n.min >= today[i][0] && n.min < e) return { k: 'open', until: e };
    }
    for (i = 0; i < yest.length; i++) if (yest[i][1] > 1440 && n.min < yest[i][1] - 1440) return { k: 'open', until: yest[i][1] - 1440 };
    for (i = 0; i < today.length; i++) if (today[i][0] > n.min && segEnd(today[i], n) !== null) return { k: 'closed', when: 'today', t: today[i][0] };
    for (var d = 1; d <= 7; d++) {
      var day = (n.day + d) % 7;
      if (p.hrs[day].length) return { k: 'closed', when: d === 1 ? 'tomorrow' : 'day', day: day, t: p.hrs[day][0][0] };
    }
    return { k: 'none' };
  }

  /* ----- CSV ----- */
  function parseCSV(text) {
    var rows = [], row = [], cur = '', q = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = ''; rows.push(row); row = [];
      } else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function rowsToPlaces(rows) {
    if (!rows.length) return [];
    var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var hasStatus = head.indexOf('status') > -1, out = [];
    rows.slice(1).forEach(function (r, idx) {
      var o = {};
      head.forEach(function (h, i) { o[h] = (r[i] || '').trim(); });
      if (hasStatus && !/^(approved|yes|ja|live|published)$/i.test(o.status)) return;
      var lat = parseFloat(String(o.lat).replace(',', '.')), lon = parseFloat(String(o.lon).replace(',', '.'));
      if (!o.name || isNaN(lat) || isNaN(lon)) return;
      var sm = /sep|getrennt|raucherraum|smoking room/i.test(o.smoke) ? 'sep'
        : (/^\s*(free|frei|smoke-?free|rauchfrei)\s*$/i.test(o.smoke) ? 'free'
        : (/^\s*(daytime|day|tags(ü|ue)ber|tagsüber)\s*$/i.test(o.smoke) ? 'day' : 'unk'));
      out.push({
        id: o.id || ('r' + idx), name: o.name, area: o.area || '', lat: lat, lon: lon, hours: o.hours, smoke: sm,
        outdoor: truthy(o.outdoor), indoor: truthy(o.indoor), fee: truthy(o.entry_fee || o.fee),
        pram: truthy(o.pram), change: truthy(o.changing || o.change),
        food: truthy(o.food), play: truthy(o.play), highchair: truthy(o.highchair),
        note_en: o.note_en || '', note_de: o.note_de || '', checked: o.checked || ''
      });
    });
    return out;
  }

  /* ===== State ===== */
  var lang = store('kb-lang') === 'de' ? 'de' : 'en';
  // With a live Sheet link set, sample places are never shown, not even briefly.
  var live = !!CONFIG.SHEET_CSV_URL;
  var PLACES = live ? [] : SAMPLE.slice(), isSample = !live, loadState = live ? 'loading' : 'ok';
  function noFilters() { return { open: false, outdoor: false, indoor: false, play: false, highchair: false }; }
  var filters = noFilters();
  var sel = null, near = false, userPos = null, area = '';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function t(k) { return I18N[lang][k]; }
  function byId(id) { for (var i = 0; i < PLACES.length; i++) if (PLACES[i].id === id) return PLACES[i]; return null; }

  /* ===== Map ===== */
  var map = L.map('map', { attributionControl: false, zoomControl: true, minZoom: 9 }).setView(CONFIG.CENTER, CONFIG.ZOOM);
  L.tileLayer(CONFIG.TILE_URL, { maxZoom: 19, attribution: CONFIG.TILE_ATTR }).addTo(map);
  L.control.attribution({ prefix: false, position: 'bottomright' }).addTo(map);
  var markerLayer = L.layerGroup().addTo(map);
  var markers = {}, meMarker = null;
  var PIN_HTML = '<svg viewBox="0 0 28 36" width="28" height="36" aria-hidden="true"><path class="b" d="M14 35C8 26 2 21 2 13.5a12 12 0 0 1 24 0C26 21 20 26 14 35Z"/><circle class="d" cx="14" cy="13.5" r="4.6"/></svg>';

  function buildMarkers() {
    markerLayer.clearLayers();
    markers = {};
    PLACES.forEach(function (p) {
      var m = L.marker([p.lat, p.lon], {
        icon: L.divIcon({ className: 'kb-pin', html: PIN_HTML, iconSize: [40, 44], iconAnchor: [20, 43] }),
        title: p.name, alt: p.name, keyboard: true
      });
      m.on('click', function () { select(p.id, false); });
      markers[p.id] = m;
    });
  }
  function fitAll(list) {
    list = list && list.length ? list : PLACES;
    if (!list.length) return;
    var b = L.latLngBounds(list.map(function (p) { return [p.lat, p.lon]; }));
    map.fitBounds(b, { padding: [40, 40], maxZoom: 15, animate: !reduce });
  }
  function focusOn(p) {
    var z = Math.max(map.getZoom(), 15);
    var ll = map.unproject(map.project([p.lat, p.lon], z).add([0, 70]), z);
    if (reduce) map.setView(ll, z, { animate: false }); else map.flyTo(ll, z, { duration: 0.6 });
  }

  /* ===== Data helpers ===== */
  function dist(p) {
    if (!userPos) return null;
    var R = 6371, r = Math.PI / 180;
    var dLat = (p.lat - userPos[0]) * r, dLon = (p.lon - userPos[1]) * r;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(userPos[0] * r) * Math.cos(p.lat * r) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function distText(km) {
    if (km < 1) return Math.round(km * 100) * 10 + ' m';
    return km.toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB', { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + ' km';
  }
  function visible() {
    var v = PLACES.filter(function (p) {
      return (!filters.open || openState(p).k === 'open') && (!filters.outdoor || p.outdoor) &&
        (!filters.indoor || p.indoor) && (!filters.play || p.play) && (!filters.highchair || p.highchair);
    });
    if (near && userPos) v.sort(function (a, b) { return dist(a) - dist(b); });
    return v;
  }
  function isVisible(id) { return visible().some(function (p) { return p.id === id; }); }
  function statusText(p) {
    var s = openState(p);
    if (s.k === 'open') return { c: 'open', s: t('open_until') + ' ' + clock(s.until) };
    if (s.k === 'closed') {
      var w = s.when === 'today' ? '' : (s.when === 'tomorrow' ? t('tomorrow') + ' ' : t('days')[s.day] + ' ');
      return { c: 'closed', s: t('closed_opens') + ' ' + w + clock(s.t) };
    }
    return { c: 'none', s: t('no_hours') };
  }
  function pillsFor(p, all) {
    var sk = { free: ['good', 'smoke_free'], day: ['good', 'smoke_day'], sep: ['warn', 'smoke_sep'], unk: ['warn', 'smoke_unk'] }[p.smoke];
    var h = '<span class="pill ' + sk[0] + '">' + t(sk[1]) + '</span>';
    if (p.outdoor) h += '<span class="pill">' + t('p_outdoor') + '</span>';
    if (p.indoor) h += '<span class="pill">' + t('p_indoor') + '</span>';
    if (p.fee) h += '<span class="pill warn">' + t('p_fee') + '</span>';
    if (all) {
      if (p.play) h += '<span class="pill">' + t('p_play') + '</span>';
      if (p.highchair) h += '<span class="pill">' + t('p_highchair') + '</span>';
      if (p.food) h += '<span class="pill">' + t('p_food') + '</span>';
      if (p.pram) h += '<span class="pill">' + t('p_pram') + '</span>';
      if (p.change) h += '<span class="pill">' + t('p_change') + '</span>';
    }
    return h;
  }
  function checkedText(p) {
    var raw = String(p.checked || '').trim();
    var m = raw.match(/^(\d{4})-(\d{1,2})/);
    if (m) {
      var d = new Date(+m[1], +m[2] - 1, 1);
      return t('checked') + ' ' + d.toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-GB', { month: 'short', year: 'numeric' });
    }
    return raw ? t('checked') + ' ' + raw : t('not_checked');
  }
  function dirUrl(p) {
    var apple = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return apple ? 'https://maps.apple.com/?daddr=' + p.lat + ',' + p.lon
                 : 'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lon;
  }

  /* ===== Render ===== */
  function renderMarkers() {
    var vis = {};
    visible().forEach(function (p) { vis[p.id] = true; });
    PLACES.forEach(function (p) {
      var m = markers[p.id];
      if (!m) return;
      if (vis[p.id]) { if (!markerLayer.hasLayer(m)) markerLayer.addLayer(m); }
      else if (markerLayer.hasLayer(m)) markerLayer.removeLayer(m);
      var e = m.getElement && m.getElement();
      if (e) e.classList.toggle('sel', p.id === sel);
      m.setZIndexOffset(p.id === sel ? 1000 : 0);
    });
  }
  function renderList() {
    var v = visible(), box = document.getElementById('list');
    if (loadState === 'loading') { box.innerHTML = '<li class="empty"><p>' + esc(t('loading')) + '</p></li>'; return; }
    if (loadState === 'fail') {
      box.innerHTML = '<li class="empty"><p>' + esc(t('load_fail')) + '</p><button type="button" class="btn" id="retry">' + esc(t('retry')) + '</button></li>';
      return;
    }
    if (!PLACES.length) { box.innerHTML = '<li class="empty"><p>' + esc(t('none_yet')) + '</p></li>'; return; }
    if (!v.length) {
      box.innerHTML = '<li class="empty"><p>' + esc(t('no_results')) + '</p><button type="button" class="btn" id="clear">' + esc(t('clear')) + '</button></li>';
      return;
    }
    box.innerHTML = v.map(function (p) {
      var st = statusText(p), d = near && userPos ? distText(dist(p)) : '';
      return '<li><button type="button" class="card' + (p.id === sel ? ' sel' : '') + '" data-id="' + esc(p.id) + '" aria-pressed="' + (p.id === sel) + '">' +
        '<span class="c-top"><span class="c-name">' + esc(p.name) + '</span>' + (d ? '<span class="c-dist">' + esc(d) + '</span>' : '') + '</span>' +
        '<span class="c-area">' + esc(p.area) + '</span>' +
        '<span class="c-st"><span class="st ' + st.c + '">' + esc(st.s) + '</span></span>' +
        '<span class="pills">' + pillsFor(p, false) + '</span></button></li>';
    }).join('');
  }
  function renderSheet() {
    var box = document.getElementById('sheet'), p = sel ? byId(sel) : null;
    if (!p) { box.hidden = true; box.innerHTML = ''; return; }
    var st = statusText(p), note = lang === 'de' ? (p.note_de || p.note_en) : (p.note_en || p.note_de);
    box.hidden = false;
    box.innerHTML =
      '<button type="button" class="x" id="sheetClose" aria-label="' + esc(t('close')) + '">&times;</button>' +
      '<div class="s-top"><h2>' + esc(p.name) + '</h2>' + (isSample ? '<span class="badge">' + esc(t('badge')) + '</span>' : '') + '</div>' +
      '<p class="s-meta">' + esc(p.area) + (p.area ? ' &middot; ' : '') + '<span class="st ' + st.c + '">' + esc(st.s) + '</span></p>' +
      (p.hours ? '<p class="s-hours">' + esc(t('hours')) + ': ' + esc(p.hours) + '</p>' : '') +
      '<div class="pills">' + pillsFor(p, true) + '</div>' +
      (note ? '<p class="s-note">' + esc(note) + '</p>' : '') +
      '<div class="s-foot"><a class="go" href="' + esc(dirUrl(p)) + '" target="_blank" rel="noopener">' + esc(t('directions')) + '</a></div>';
  }
  function renderCount() {
    var n = visible().length;
    document.getElementById('count').textContent = loadState !== 'ok' || !PLACES.length ? '' : n + ' ' + (n === 1 ? t('place1') : t('placesN'));
  }
  function renderAreas() {
    var seen = {}, names = [];
    PLACES.forEach(function (p) { if (p.area && !seen[p.area]) { seen[p.area] = 1; names.push(p.area); } });
    names.sort(function (a, b) { return a.localeCompare(b, 'de'); });
    var h = '<button type="button" class="area" data-area="" aria-pressed="' + (area === '') + '">' + esc(t('all_berlin')) + '</button>';
    names.forEach(function (n) { h += '<button type="button" class="area" data-area="' + esc(n) + '" aria-pressed="' + (area === n) + '">' + esc(n) + '</button>'; });
    document.getElementById('areas').innerHTML = h;
  }
  function renderAll() { renderMarkers(); renderList(); renderSheet(); renderCount(); }
  function setStatus(msg) {
    var s = document.getElementById('status');
    s.textContent = msg || '';
    s.hidden = !msg;
  }
  function applyI18n() {
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (n) { n.setAttribute('aria-label', t(n.getAttribute('data-i18n-aria'))); });
    var lb = document.getElementById('lang');
    lb.textContent = lang === 'en' ? 'DE' : 'EN';
    lb.setAttribute('aria-label', lang === 'en' ? 'Auf Deutsch anzeigen' : 'Show in English');
    document.getElementById('notice').hidden = !isSample;
    // The suggestion box only appears once a form link is set in CONFIG.SUGGEST_URL.
    // The suggest button only appears once a form link is set in CONFIG.SUGGEST_URL.
    var sl = document.getElementById('suggestLink');
    if (CONFIG.SUGGEST_URL) sl.href = CONFIG.SUGGEST_URL;
    sl.hidden = !CONFIG.SUGGEST_URL;
  }

  function ensureVisible(p) {
    var box = document.getElementById('sheet');
    if (box.hidden) return;
    var size = map.getSize(), pt = map.latLngToContainerPoint([p.lat, p.lon]);
    var limit = size.y - (box.offsetHeight + 30) - 8;
    if (pt.y > limit) map.panBy([0, pt.y - limit], { animate: !reduce });
    else if (pt.y < 48) map.panBy([0, pt.y - 48], { animate: !reduce });
  }
  function select(id, pan) {
    sel = id;
    renderAll();
    if (!id) return;
    if (pan) focusOn(byId(id)); else ensureVisible(byId(id));
  }

  /* ===== Events ===== */
  document.getElementById('list').addEventListener('click', function (e) {
    var c = e.target.closest('.card');
    if (c) {
      select(c.getAttribute('data-id'), true);
      if (window.matchMedia('(max-width: 899px)').matches) {
        document.querySelector('.mapcol').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      }
      return;
    }
    if (e.target.closest('#retry')) { load(); return; }
    if (e.target.closest('#clear')) {
      filters = noFilters();
      Array.prototype.forEach.call(document.querySelectorAll('[data-f]'), function (b) { b.setAttribute('aria-pressed', 'false'); });
      renderAll();
    }
  });
  document.getElementById('sheet').addEventListener('click', function (e) {
    if (e.target.closest('#sheetClose')) select(null, false);
  });
  document.getElementById('filters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]');
    if (!b) return;
    var k = b.getAttribute('data-f');
    filters[k] = !filters[k];
    b.setAttribute('aria-pressed', filters[k] ? 'true' : 'false');
    if (sel && !isVisible(sel)) sel = null;
    renderAll();
  });
  document.getElementById('areas').addEventListener('click', function (e) {
    var b = e.target.closest('.area');
    if (!b) return;
    area = b.getAttribute('data-area');
    renderAreas();
    fitAll(area ? PLACES.filter(function (p) { return p.area === area; }) : PLACES);
  });
  document.getElementById('near').addEventListener('click', function () {
    var b = document.getElementById('near');
    if (near) {
      near = false; b.setAttribute('aria-pressed', 'false');
      if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
      renderAll();
      return;
    }
    if (!navigator.geolocation) { setStatus(t('near_fail')); return; }
    setStatus(t('near_busy'));
    navigator.geolocation.getCurrentPosition(function (pos) {
      userPos = [pos.coords.latitude, pos.coords.longitude];
      near = true; b.setAttribute('aria-pressed', 'true'); setStatus('');
      if (meMarker) map.removeLayer(meMarker);
      meMarker = L.circleMarker(userPos, { radius: 8, className: 'me', interactive: false }).addTo(map);
      var v = visible();
      var bounds = L.latLngBounds([userPos]);
      v.slice(0, 3).forEach(function (p) { bounds.extend([p.lat, p.lon]); });
      map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15, animate: !reduce });
      renderAll();
    }, function () {
      near = false; b.setAttribute('aria-pressed', 'false'); setStatus(t('near_fail'));
    }, { timeout: 10000, maximumAge: 60000 });
  });
  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'en' ? 'de' : 'en';
    store('kb-lang', lang);
    applyI18n(); renderAreas(); renderAll();
  });
  if (window.ResizeObserver) new ResizeObserver(function () { map.invalidateSize(); }).observe(document.getElementById('map'));

  /* ===== Start ===== */

  function start() {
    PLACES.forEach(function (p) { p.hrs = parseHours(p.hours); });
    buildMarkers();
    applyI18n(); renderAreas();
    sel = null;
    renderAll();
    fitAll();
  }
  PLACES.forEach(function (p) { if (p.indoor === undefined) p.indoor = !p.outdoor; });
  start();

  function load() {
    loadState = 'loading';
    renderAll();
    fetch(CONFIG.SHEET_CSV_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
      .then(function (txt) {
        PLACES = rowsToPlaces(parseCSV(txt)); isSample = false; loadState = 'ok';
        start();
      })
      .catch(function () { loadState = 'fail'; renderAll(); });
  }
  if (live) load();
})();
</script>
</body>
