<style>
:root {
  /* Layout: street-sign wordmark, filter chips, neighbourhood row, one real map with a place sheet on it, card list beside or below */
  --bg: #eceff3;
  --surface: #ffffff;
  --ink: #14233a;
  --ink-soft: #52627a;
  --line: #ccd4df;
  --plate: #1c3d6e;
  --plate-ink: #ffffff;
  --pin: #e8a012;
  --pin-stroke: #14233a;
  --amber-ink: #2b1c00;
  --sel: #e4ecf8;
  --good: #1c7348;
  --warn: #8a5700;
  --warn-bg: #fbebc7;
  --focus: var(--plate);
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
:root[data-palette="hopfen"] { --plate: #1f5a43; --pin: #e8623a; --sel: #e0efe7; }
:root[data-palette="schuss"] { --plate: #7d1f45; --pin: #6fae2f; --sel: #f6e3ea; }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1726; --surface: #15243a; --ink: #e7eef8; --ink-soft: #9fb0c7; --line: #2a3c55;
    --plate: #2b5aa0; --pin: #f2b032; --pin-stroke: #0d1726; --sel: #1b3555;
    --good: #6fd6a0; --warn: #f0c56a; --warn-bg: #3a2d10; --focus: #9dc0ff;
    color-scheme: dark;
  }
  :root[data-palette="hopfen"] { --plate: #2f7d5c; --pin: #f07a52; --sel: #1b3a2e; }
  :root[data-palette="schuss"] { --plate: #a1325f; --pin: #8cc84b; --sel: #3a1a29; }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: max(14px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.notice {
  margin: 0; padding: 8px 12px; border-radius: 8px;
  background: var(--warn-bg); color: var(--warn);
  font-size: 13px; font-weight: 600;
}

.head { display: flex; flex-direction: column; gap: 6px; }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.plate {
  margin: 0; display: inline-flex; padding: 5px;
  background: var(--plate); color: var(--plate-ink); border-radius: 12px;
}
.plate-in {
  display: block; border: 2px solid var(--plate-ink); border-radius: 8px;
  padding: 3px 14px 0; white-space: nowrap;
  font-family: var(--font-display); font-weight: 700; text-transform: uppercase;
  font-size: clamp(28px, 8vw, 54px); line-height: 1.05; letter-spacing: 0.05em;
}
.lang {
  min-width: 44px; min-height: 44px; padding: 0 12px; border-radius: 10px;
  background: var(--surface); border: 1.5px solid var(--line);
  font-weight: 700; font-size: 14px; letter-spacing: 0.04em; cursor: pointer;
}
.tagline { margin: 6px 0 0; font-size: 18px; font-weight: 700; text-wrap: balance; max-width: 34em; }
.rule { margin: 0; color: var(--ink-soft); font-size: 15px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--line);
  font-weight: 600; font-size: 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--plate); border-color: var(--plate); color: var(--plate-ink); }
.status { margin: -4px 0 0; font-size: 13px; color: var(--ink-soft); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
.mapcol, .sidecol { min-width: 0; }

.areas { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 10px; scrollbar-width: none; }
.areas::-webkit-scrollbar { display: none; }
.area {
  flex: none; min-height: 34px; padding: 0 12px; border-radius: 8px;
  background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
  font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.area[aria-pressed="true"] { border-color: var(--plate); color: var(--ink); background: var(--sel); }

.mapbox { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); isolation: isolate; }
#map { width: 100%; aspect-ratio: 1 / 1; max-height: 72vh; min-height: 300px; background: var(--surface); font-family: var(--font-body); }
.leaflet-tile-pane { filter: saturate(0.6) contrast(0.96); }
@media (prefers-color-scheme: dark) {
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(0.5) brightness(0.9) contrast(0.9); }
}
.leaflet-bar a, .leaflet-bar a:hover { background: var(--surface); color: var(--ink); border-color: var(--line); }
.leaflet-control-attribution { font-size: 11px; }

.kb-pin { display: flex; align-items: flex-end; justify-content: center; }
.kb-pin svg { filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35)); transition: transform 0.15s; transform-origin: 50% 100%; }
.kb-pin .b { fill: var(--pin); stroke: var(--pin-stroke); stroke-width: 2; stroke-linejoin: round; }
.kb-pin .d { fill: var(--surface); }
.kb-pin.sel svg { transform: scale(1.2); }
.kb-pin.sel .b { fill: var(--plate); stroke: var(--pin); }
.kb-pin.sel .d { fill: var(--pin); }
.kb-pin:focus-visible { outline: 3px solid var(--focus); outline-offset: -4px; border-radius: 8px; }
.me { fill: #2f6fe0; stroke: #ffffff; stroke-width: 3; }

.sheet {
  position: absolute; left: 10px; right: 10px; bottom: 30px; z-index: 1100;
  padding: 12px 44px 12px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 6px 22px rgba(10, 20, 40, 0.22);
}
.sheet .x {
  position: absolute; top: 6px; right: 6px; width: 36px; height: 36px; border-radius: 8px;
  background: transparent; border: 0; font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-soft);
}
.s-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.s-top h2 { margin: 0; font-size: 18px; font-weight: 800; text-wrap: balance; }
.badge {
  padding: 2px 8px; border-radius: 6px; background: var(--pin); color: var(--amber-ink);
  font-size: 11px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase;
}
.s-meta { margin: 2px 0 0; color: var(--ink-soft); font-size: 14px; }
.s-hours { margin: 4px 0 0; font-size: 13px; color: var(--ink-soft); }
.s-note { margin: 8px 0 0; font-size: 14px; }
.s-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 10px; }
.s-ver { font-size: 12px; color: var(--ink-soft); }
.go {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 10px;
  background: var(--plate); color: var(--plate-ink); font-weight: 700; font-size: 14px; text-decoration: none;
}

.st { font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.st::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: currentColor; }
.st.open { color: var(--good); }

.pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pill {
  padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 12px; font-weight: 600; color: var(--ink-soft); white-space: nowrap;
}
.pill.good { border-color: var(--good); color: var(--good); }
.pill.warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }

.listhead { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 10px; }
.listhead h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.06em; text-transform: uppercase; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
.card {
  display: block; width: 100%; text-align: left; cursor: pointer;
  padding: 12px 14px; border-radius: 12px;
  background: var(--surface); border: 1.5px solid var(--line);
}
.card.sel { border-color: var(--plate); background: var(--sel); }
.c-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.c-name { font-weight: 700; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.c-dist { font-size: 13px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }
.c-area { display: block; font-size: 13px; color: var(--ink-soft); }
.c-st { display: block; margin-top: 2px; }
.empty { grid-column: 1 / -1; padding: 18px; border: 1.5px dashed var(--line); border-radius: 12px; text-align: center; }
.empty p { margin: 0 0 10px; }
.btn {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; cursor: pointer;
  background: var(--plate); color: var(--plate-ink); border: 0; font-weight: 700; font-size: 15px; text-decoration: none;
}

.suggest {
  margin-top: 20px; padding: 16px; border: 1.5px dashed var(--line); border-radius: 14px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
}
.suggest p { margin: 0; }
.suggest .s-title { font-weight: 700; }
.suggest .s-note2 { flex-basis: 100%; font-size: 13px; color: var(--ink-soft); }

.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; font-size: 13px; color: var(--ink-soft); }
.linkbtn { background: none; border: 0; padding: 6px 0; font-size: 13px; color: var(--ink-soft); text-decoration: underline; cursor: pointer; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 8px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--line); font-size: 13px; font-weight: 600; cursor: pointer;
}
.sw[aria-pressed="true"] { border-color: var(--ink); }
.sw i { width: 22px; height: 22px; border-radius: 50%; display: block; border: 1px solid rgba(0, 0, 0, 0.15); }

@media (max-width: 599px) {
  .sheet .pills, .sheet .s-hours, .sheet .s-ver { display: none; }
  .sheet .s-note { margin-top: 4px; font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .sheet { padding-block: 10px; }
}
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; }
  .mapcol { position: sticky; top: 16px; }
}
@media (prefers-reduced-motion: reduce) { .kb-pin svg { transition: none; } }
</style>
</head>

<div class="wrap">
  <p class="notice" id="notice" data-i18n="notice" hidden></p>

  <header class="head">
    <div class="head-row">
      <h1 class="plate"><span class="plate-in">Kinder Beers</span></h1>
      <button type="button" id="lang" class="lang">DE</button>
    </div>
    <p class="tagline" data-i18n="tagline"></p>
    <p class="rule" data-i18n="rule"></p>
  </header>

  <div class="filters" id="filters" role="group" data-i18n-aria="filters">
    <button type="button" class="chip" id="near" aria-pressed="false" data-i18n="near"></button>
    <button type="button" class="chip" data-f="open" aria-pressed="false" data-i18n="f_open"></button>
    <button type="button" class="chip" data-f="outdoor" aria-pressed="false" data-i18n="f_outdoor"></button>
    <button type="button" class="chip" data-f="indoor" aria-pressed="false" data-i18n="f_indoor"></button>
    <button type="button" class="chip" data-f="play" aria-pressed="false" data-i18n="f_play"></button>
    <button type="button" class="chip" data-f="highchair" aria-pressed="false" data-i18n="f_highchair"></button>
  </div>
  <p class="status" id="status" aria-live="polite" hidden></p>

  <div class="layout">
    <section class="mapcol">
      <div class="areas" id="areas" role="group" data-i18n-aria="areas"></div>
      <div class="mapbox">
        <div id="map" data-i18n-aria="map_label"></div>
        <div class="sheet" id="sheet" aria-live="polite" hidden></div>
      </div>
    </section>

    <section class="sidecol">
      <div class="listhead"><h2 id="count"></h2></div>
      <ul class="list" id="list"></ul>
      <div class="suggest">
        <p class="s-title" data-i18n="sug_title"></p>
        <a class="btn" id="suggestLink" href="#" target="_blank" rel="noopener" hidden data-i18n="sug_btn"></a>
        <button type="button" class="btn" id="suggest" hidden data-i18n="sug_btn"></button>
        <p class="s-note2" id="sugNote" aria-live="polite" hidden data-i18n="sug_note"></p>
      </div>
    </section>
  </div>

  <footer class="foot">
    <button type="button" class="linkbtn" id="palToggle" aria-expanded="false" data-i18n="try_colours"></button>
    <div class="swatches" id="swatches" hidden>
      <button type="button" class="sw" data-pal="sign" aria-pressed="true"><i style="background:linear-gradient(135deg,#1c3d6e 50%,#e8a012 50%)"></i>Sign</button>
      <button type="button" class="sw" data-pal="hopfen" aria-pressed="false"><i style="background:linear-gradient(135deg,#1f5a43 50%,#e8623a 50%)"></i>Hopfen</button>
      <button type="button" class="sw" data-pal="schuss" aria-pressed="false"><i style="background:linear-gradient(135deg,#7d1f45 50%,#6fae2f 50%)"></i>Schuss</button>
    </div>
  </footer>
  <noscript><p class="notice">Kinder Beers needs JavaScript to show the map.</p></noscript>
</div>

    if (e.target.closest('#sheetClose')) select(null, false);
  });
  document.getElementById('filters').addEventListener('click', function (e) {
    var b = e.target.closest('[data-f]');
    if (!b) return;
    var k = b.getAttribute('data-f');
    filters[k] = !filters[k];
    b.setAttribute('aria-pressed', filters[k] ? 'true' : 'false');
    if (sel && !isVisible(sel)) sel = null;
    renderAll();
  });
  document.getElementById('areas').addEventListener('click', function (e) {
    var b = e.target.closest('.area');
    if (!b) return;
    area = b.getAttribute('data-area');
    renderAreas();
    fitAll(area ? PLACES.filter(function (p) { return p.area === area; }) : PLACES);
  });
  document.getElementById('near').addEventListener('click', function () {
    var b = document.getElementById('near');
    if (near) {
      near = false; b.setAttribute('aria-pressed', 'false');
      if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
      renderAll();
      return;
    }
    if (!navigator.geolocation) { setStatus(t('near_fail')); return; }
    setStatus(t('near_busy'));
    navigator.geolocation.getCurrentPosition(function (pos) {
      userPos = [pos.coords.latitude, pos.coords.longitude];
      near = true; b.setAttribute('aria-pressed', 'true'); setStatus('');
      if (meMarker) map.removeLayer(meMarker);
      meMarker = L.circleMarker(userPos, { radius: 8, className: 'me', interactive: false }).addTo(map);
      var v = visible();
      var bounds = L.latLngBounds([userPos]);
      v.slice(0, 3).forEach(function (p) { bounds.extend([p.lat, p.lon]); });
      map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15, animate: !reduce });
      renderAll();
    }, function () {
      near = false; b.setAttribute('aria-pressed', 'false'); setStatus(t('near_fail'));
    }, { timeout: 10000, maximumAge: 60000 });
  });
  document.getElementById('lang').addEventListener('click', function () {
    lang = lang === 'en' ? 'de' : 'en';
    store('kb-lang', lang);
    applyI18n(); renderAreas(); renderAll();
  });
  document.getElementById('suggest').addEventListener('click', function () {
    document.getElementById('sugNote').hidden = false;
  });
  document.getElementById('palToggle').addEventListener('click', function () {
    var open = document.getElementById('swatches').hidden;
    document.getElementById('swatches').hidden = !open;
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  function setPalette(p) {
    if (p === 'sign') document.documentElement.removeAttribute('data-palette');
    else document.documentElement.setAttribute('data-palette', p);
    Array.prototype.forEach.call(document.querySelectorAll('.sw'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-pal') === p ? 'true' : 'false'); });
  }
  document.getElementById('swatches').addEventListener('click', function (e) {
    var b = e.target.closest('.sw');
    if (!b) return;
    var p = b.getAttribute('data-pal');
    setPalette(p); store('kb-palette', p);
  });
  if (window.ResizeObserver) new ResizeObserver(function () { map.invalidateSize(); }).observe(document.getElementById('map'));

  /* ===== Start ===== */
  var savedPal = store('kb-palette');
  if (savedPal === 'hopfen' || savedPal === 'schuss') setPalette(savedPal);

  function start() {
    PLACES.forEach(function (p) { p.hrs = parseHours(p.hours); });
    buildMarkers();
    applyI18n(); renderAreas();
    sel = null;
    renderAll();
    fitAll();
  }
  PLACES.forEach(function (p) { if (p.indoor === undefined) p.indoor = !p.outdoor; });
  start();

  function load() {
    loadState = 'loading';
    renderAll();
    fetch(CONFIG.SHEET_CSV_URL, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
      .then(function (txt) {
        PLACES = rowsToPlaces(parseCSV(txt)); isSample = false; loadState = 'ok';
        start();
      })
      .catch(function () { loadState = 'fail'; renderAll(); });
  }
  if (live) load();
})();
</script>
</body>
</html>
